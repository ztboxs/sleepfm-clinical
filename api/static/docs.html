<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SleepFM Clinical - 使用文档</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <style>
    :root {
      --primary: #1877f2;
      --primary-hover: #166fe5;
      --primary-light: #e7f3ff;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text-primary: #1c1e21;
      --text-secondary: #65676b;
      --text-tertiary: #8a8d91;
      --border: #dadde1;
      --border-light: #e4e6eb;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.1);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      line-height: 1.7;
    }

    .docs-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
      font-weight: 700;
      text-decoration: none;
    }

    .logo {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--primary), #6c5ce7);
      color: white;
    }

    .docs-header nav { display: flex; gap: 8px; }

    .docs-header nav a {
      padding: 8px 12px;
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .docs-header nav a:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .docs-layout {
      width: min(1320px, calc(100% - 40px));
      margin: 28px auto 56px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .docs-sidebar {
      position: sticky;
      top: 92px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .docs-sidebar h1 { margin: 0 0 18px; font-size: 22px; }
    #docNavigation { display: grid; gap: 6px; }

    #docNavigation button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-secondary);
      font: 500 14px/1.35 var(--font);
      text-align: left;
      cursor: pointer;
    }

    #docNavigation button:hover {
      background: var(--bg);
      color: var(--text-primary);
    }

    #docNavigation button.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .docs-reader {
      min-height: calc(100vh - 148px);
      padding: 40px clamp(24px, 5vw, 64px);
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .doc-status {
      padding: 72px 20px;
      color: var(--text-secondary);
      text-align: center;
    }

    .doc-status button {
      margin-top: 12px;
      padding: 8px 14px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      font: 600 14px var(--font);
      cursor: pointer;
    }

    .markdown-body { max-width: 820px; margin: 0 auto; }

    .markdown-body h1 {
      margin: 0 0 28px;
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.2;
    }

    .markdown-body h2 {
      margin: 42px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
      font-size: 24px;
    }

    .markdown-body h3 { margin: 28px 0 12px; font-size: 18px; }
    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol { margin: 0 0 16px; }
    .markdown-body ul,
    .markdown-body ol { padding-left: 24px; }
    .markdown-body a { color: var(--primary); text-underline-offset: 3px; }

    .markdown-body code {
      padding: 2px 6px;
      border-radius: 5px;
      background: #f5f7fa;
      color: #b42318;
      font-size: 0.9em;
    }

    .markdown-body pre {
      margin: 18px 0;
      padding: 18px;
      overflow: auto;
      border-radius: var(--radius-lg);
      background: #101828;
      color: #f8fafc;
    }

    .markdown-body pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .markdown-body table {
      width: 100%;
      margin: 18px 0;
      border-collapse: collapse;
      font-size: 14px;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 10px 12px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .markdown-body th { background: var(--bg); }

    .markdown-body blockquote {
      margin: 18px 0;
      padding: 12px 16px;
      border-left: 4px solid var(--primary);
      background: var(--primary-light);
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .docs-header {
        height: auto;
        min-height: 60px;
        padding: 10px 16px;
      }

      .docs-header nav a { padding: 7px 8px; font-size: 13px; }

      .docs-layout {
        width: min(100% - 24px, 720px);
        margin-top: 16px;
        grid-template-columns: 1fr;
      }

      .docs-sidebar { position: static; }
      #docNavigation { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .docs-reader { min-height: auto; padding: 28px 18px; }
      .markdown-body table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header class="docs-header">
    <a class="brand" href="/"><span class="logo">S</span><span>SleepFM Clinical</span></a>
    <nav><a href="/">返回控制台</a><a href="/docs">API 参考</a></nav>
  </header>
  <main class="docs-layout">
    <aside class="docs-sidebar">
      <p class="eyebrow">DOCUMENTATION</p>
      <h1>使用文档</h1>
      <nav id="docNavigation" aria-label="文档列表"></nav>
    </aside>
    <section class="docs-reader">
      <div id="docStatus" class="doc-status">正在加载文档…</div>
      <article id="docContent" class="markdown-body" hidden></article>
    </section>
  </main>
  <script>
    const API_BASE = '';
    let documents = [];
    let activeDocument = '';

    function showError(message) {
      const status = document.getElementById('docStatus');
      status.hidden = false;
      status.innerHTML = '';
      const text = document.createElement('p');
      text.textContent = message;
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = '重新加载';
      retry.addEventListener('click', loadDocuments);
      status.append(text, retry);
      document.getElementById('docContent').hidden = true;
    }

    function renderNavigation() {
      const navigation = document.getElementById('docNavigation');
      navigation.innerHTML = '';
      documents.forEach(documentInfo => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = documentInfo.title;
        button.className = documentInfo.name === activeDocument ? 'active' : '';
        button.addEventListener('click', () => loadDocument(documentInfo.name));
        navigation.appendChild(button);
      });
    }

    async function loadDocument(name) {
      const status = document.getElementById('docStatus');
      const content = document.getElementById('docContent');
      status.hidden = false;
      status.textContent = '正在加载文档…';
      content.hidden = true;

      try {
        const response = await fetch(`${API_BASE}/api/v1/docs/${encodeURIComponent(name)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (!window.marked) throw new Error('Markdown 渲染器加载失败');
        const markdown = await response.text();
        content.innerHTML = marked.parse(markdown);
        content.querySelectorAll('a[href^="http"]').forEach(link => {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        });
        activeDocument = name;
        window.location.hash = encodeURIComponent(name);
        renderNavigation();
        status.hidden = true;
        content.hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        showError(`文档加载失败：${error.message}`);
      }
    }

    async function loadDocuments() {
      try {
        const response = await fetch(`${API_BASE}/api/v1/docs`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        documents = (await response.json()).documents;
        if (!documents.length) throw new Error('没有可用文档');
        const requested = decodeURIComponent(window.location.hash.slice(1));
        const initial = documents.some(item => item.name === requested)
          ? requested
          : documents[0].name;
        renderNavigation();
        await loadDocument(initial);
      } catch (error) {
        showError(`文档列表加载失败：${error.message}`);
      }
    }

    loadDocuments();
  </script>
</body>
</html>
